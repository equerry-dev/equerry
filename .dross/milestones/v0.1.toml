phases = ["02-provider-model", "03-assist-probe", "04-chat-drivers", "05-voice-roundtrip", "06-tools-actions", "07-screen-context", "08-remote-stt-tts", "09-release-polish"]

[milestone]
  version = "v0.1"
  title = "Full assistant: probe, spoken chat, tools, screen-context, remote drivers, release"
  status = "active"
  started = "2026-06-09"

[scope]
  success_criteria = ["The app can be set as Android's default digital assistant and is invoked by the assist gesture, showing Equerry's session UI.", "[HARD GATE] A Phase-0 results table exists and is reviewed: per ~10 real apps, whether AssistStructure arrived (and its text-node count) and whether an assist screenshot arrived or was blocked.", "A user can create/edit a Provider Profile (type, baseUrl, key, model), have its key stored encrypted, and map it to the CHAT slot via the settings UI; an unconfigured slot shows clear guidance.", "With one configured chat provider, a user can hold a spoken Q&A end to end: gesture -> system STT -> CHAT reply -> spoken back via system TTS and rendered in the session.", "A user can ask Equerry to perform an action (set a timer/alarm, create a calendar event, draft an email/SMS); the model only stages the action and it executes only after an explicit in-app confirmation tap (r-02) — nothing side-effecting fires automatically.", "From the assist session, a user can send the current screen's content to the VISION-mapped provider (or an OCR+CHAT fallback) and get a useful answer about what's on screen, reading the screen only via the sanctioned Assist API (never AccessibilityService, r-01).", "A user can map a remote STT provider (e.g. Whisper) and a remote TTS provider to the STT/TTS capability slots and run the spoken round-trip through them instead of system STT/TTS.", "First-run onboarding walks the user through setting Equerry as the default assistant and configuring a provider; the app ships store-listing metadata and release polish for F-Droid and Google Play."]
  non_goals = ["Permanent out-of-scope items remain in project.toml non_goals (AccessibilityService-based automation, on-device model inference, custom wake word, multi-user/cloud sync) — unchanged by this milestone."]
