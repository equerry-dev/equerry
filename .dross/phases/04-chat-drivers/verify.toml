[[criterion]]
  id = "c-3"
  status = "weak"
  tests = [
    "app/src/test/java/dev/equerry/app/ui/chat/ChatViewModelTest.kt:unmapped_send_sets_guidance_and_never_calls_the_driver",
  ]
  notes = "The behavioural core is well covered: with no CHAT mapping, send() sets the guidance flag, never calls the driver (server.requestCount==0), and does not crash. But no Compose test asserts the guidance banner itself renders — the 'shows in-UI guidance' rendering is verified only at the state layer."

[[criterion]]
  id = "c-4"
  status = "covered"
  tests = [
    "app/src/test/java/dev/equerry/app/ui/chat/ChatViewModelTest.kt:a_failed_request_renders_a_keyless_error",
    "app/src/test/java/dev/equerry/app/providers/drivers/ChatErrorMapperTest.kt:mapped_message_never_contains_a_key_even_when_the_input_does",
    "app/src/test/java/dev/equerry/app/providers/drivers/ChatModelsTest.kt:errorMessageNeverContainsKey",
    "app/src/test/java/dev/equerry/app/providers/drivers/ChatHttpClientTest.kt:key_never_in_logged_request",
    "app/src/test/java/dev/equerry/app/providers/drivers/ChatHttpClientTest.kt:logging_is_live",
    "app/src/test/java/dev/equerry/app/providers/drivers/ChatDriverTest.kt:a_401_surfaces_chat_error_auth",
  ]
  notes = "Failure path is defended in depth: 401->Auth surfaces a readable error in the VM state, and key-never-leaks is asserted at the model, mapper, redaction/logging, builder and recorded-request layers."

[[criterion]]
  id = "c-5"
  status = "covered"
  tests = [
    "app/src/test/java/dev/equerry/app/ui/chat/ChatViewModelTest.kt:second_send_carries_the_first_turn_as_context",
    "app/src/test/java/dev/equerry/app/providers/drivers/ChatSessionTest.kt:request_carries_prior_turns_in_order_with_system_prompt_first",
