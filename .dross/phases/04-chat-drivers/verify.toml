  text = "ChatScreen.kt has no Compose UI test, unlike ProviderEditScreen/ProbeScreen. c-1's transcript-bubble rendering and c-3's guidance-banner rendering are verified only at the ViewModel/state layer — a rendering regression would not fail any test. Add a Robolectric ChatScreen test (sent message + reply bubble appear; banner shows when unmapped)."

