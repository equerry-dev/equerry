"""
covers        = ["c-1", "c-3", "c-6"]
test_contract = [
  "Under Robolectric Compose test, ProviderEditScreen renders the OLLAMA variant with NO API-key field and the ANTHROPIC variant WITH a required key field, and an invalid submit shows the inline error node; ProviderEditScreenTest fails otherwise.",
  "ProviderListScreen renders one row per saved profile label with a delete affordance; ProviderListScreenTest fails if a saved profile is missing from the rendered list.",
]
status        = "pending"

[[task]]
id            = "t-9"
wave          = 5
depends_on    = ["t-7"]
title         = "Capability Slots screen + CHAT picker (Compose)"
files         = [
  "app/src/main/java/dev/equerry/app/ui/slots/SlotsScreen.kt",
  "app/src/test/java/dev/equerry/app/ui/slots/SlotsScreenTest.kt",
]
description   = """
Compose Capability Slots screen: CHAT enabled, the other slots greyed 'coming soon';
shows guidance when CHAT is unmapped; tapping CHAT opens a picker of saved profiles.
"""
covers        = ["c-4", "c-5"]
test_contract = [
  "Under Robolectric Compose test, SlotsScreen renders CHAT as enabled and the other slots as disabled with a 'coming soon' marker, and renders the guidance text node when no CHAT profile is mapped; SlotsScreenTest fails otherwise.",
  "Tapping the CHAT slot opens a picker listing the saved profile labels; SlotsScreenTest fails if the picker does not show a saved profile.",
]
